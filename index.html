<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像2つ・リンク付き・バツボタンのみのポップアップ広告</title>
<style>
  /* 広告を囲むコンテナ（画面中央にポップアップ） */
  .ad-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 画面中央に配置 */
    width: 70%;
    max-width: 500px;        /* 2枚並ぶので最大幅を少し広めに設定 */
    z-index: 99999;          /* 他の要素より最前面に表示 */
    box-sizing: border-box;
    display: none;           /* 初期状態は非表示 */
    opacity: 0;              /* フェードイン用 */
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  /* 表示時のクラス */
  .ad-popup.show {
    display: block;
    opacity: 1;
    visibility: visible;
  }

  /* 閉じるボタン（ポップアップ全体の左上に配置） */
  .close-btn {
    position: absolute;
    top: -15px;             /* 左上から少しはみ出すように配置 */
    left: -15px;
    background: #fff;       /* 白地 */
    color: #000;            /* 黒いバツ印 */
    border: 1px solid #ccc; /* 薄い枠線 */
    width: 32px;
    height: 32px;
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
    text-align: center;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100000;         /* 画像より前面に表示 */
    box-sizing: border-box;
  }

  /* 広告の中身（画像を並べる設定） */
  .ad-content {
    display: flex;           /* 横並びにする */
    gap: 15px;               /* 画像と画像の間の隙間 */
  }

  /* リンクタグ（画像を均等なサイズにするための設定） */
  .ad-content a {
    flex: 1;                 /* 幅を均等に分ける */
    display: block;
  }

  /* 広告画像のスタイル */
  .ad-image {
    width: 100%;             /* 割り当てられた幅いっぱいに表示 */
    height: auto;            /* 縦横比をキープ */
    vertical-align: middle;
  }

  /* スマホ対応（画面幅が600px以下になったら縦並びにする） */
  @media (max-width: 400px) {
    .ad-content {
      flex-direction: column; /* 縦並びに変更 */
      gap: 150px;              /* 縦の隙間を少し狭くする */
    }
  }
</style>
</head>
<body>

<!-- 広告のHTML（ポップアップ） -->
<div id="adPopup" class="ad-popup">
  <button id="closeAdBtn" class="close-btn" aria-label="広告を閉じる">&times;</button>
  
  <div class="ad-content">
    <!-- 1枚目の画像 -->
    <!-- hrefの中にリンク先のURLを入力します。target="_blank"で新しいタブで開きます。 -->
      <img src="ad1.png"  class="ad-image">
    </a>
    
    <!-- 2枚目の画像 -->
    <!-- こちらも同様にリンク先URLを入力してください。 -->
    <a href="https://online.fliphtml5.com/ewwcj/tjui/#p=1" target="_blank" rel="noopener noreferrer">
      <img src="ad2.png"  class="ad-image">
    </a>
  </div>
</div>

<!-- 広告を制御するJavaScript -->
<script>
  const closeBtn = document.getElementById('closeAdBtn');
  const adPopup = document.getElementById('adPopup');

  // ページ読み込み完了から2秒後に広告を表示
  window.addEventListener('load', function() {
    setTimeout(function() {
      adPopup.classList.add('show');
    }, 2000); 
  });

  // 閉じるボタンがクリックされたときの処理
  closeBtn.addEventListener('click', function() {
    adPopup.classList.remove('show');
  });
</script>

</body>
</html>
